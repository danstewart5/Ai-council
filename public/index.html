<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>AI Council</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%237c8cff'/><circle cx='50' cy='50' r='16' fill='%230f1115'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>AI Council</h1>
    </div>
    <div class="spend" id="spend" title="Spending this month (stored on this device)">This month: $0.00 of $20</div>
  </header>

  <main>
    <section class="ask card">
      <label for="question" class="sr-only">Your question</label>
      <textarea id="question" rows="5" placeholder="Ask the council anything…" maxlength="6000"></textarea>
      <div class="buttons">
        <button id="btn-quick" class="btn secondary" type="button">
          Quick <span class="sub" id="quick-sub">2 models</span>
        </button>
        <button id="btn-full" class="btn primary" type="button">
          Full Council <span class="sub" id="full-sub">3 models</span>
        </button>
      </div>
      <div id="progress" class="progress" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <span id="progress-text">Round 1 of 3…</span>
      </div>
      <div id="notice" class="notice" role="alert" hidden></div>
    </section>

    <section id="results" aria-live="polite"></section>

    <div class="history-actions" id="history-actions" hidden>
      <button id="btn-clear" class="btn link" type="button">Clear history</button>
    </div>
  </main>

  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
